services:
  - type: web
    name: n8n-agent-host
    env: docker
    repo: https://github.com/n8n-io/n8n
    plan: free
    region: frankfurt
    envVars:
      - key: N8N_HOST
        value: n8n-agent-host.onrender.com
      - key: NODE_ENV
        value: production
      - key: N8N_ENCRYPTION_KEY
        value: uneCleAleatoireSuperSecurisee123! # Tu peux changer ça par n'importe quelle phrase
      - key: DB_TYPE
        value: postgresdb
      - key: DB_POSTGRESDB_HOST
        fromDatabase:
          name: n8n-db
          property: host
      - key: DB_POSTGRESDB_DATABASE
        fromDatabase:
          name: n8n-db
          property: database
      - key: DB_POSTGRESDB_USER
        fromDatabase:
          name: n8n-db
          property: user
      - key: DB_POSTGRESDB_PASSWORD
        fromDatabase:
          name: n8n-db
          property: password

databases:
  - name: n8n-db
    plan: free
